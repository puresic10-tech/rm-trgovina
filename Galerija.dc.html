<!DOCTYPE html>
<html lang="sr">
<head>
<style>x-dc [data-raw-hide]{display:none!important}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" as="image" href="./assets/gallery/vozni-park-mobile.webp" imagesrcset="./assets/gallery/vozni-park-mobile.webp 750w, ./assets/gallery/vozni-park.webp 1200w" imagesizes="(max-width: 767px) 100vw, 400px" fetchpriority="high">
<link rel="preload" as="image" href="./assets/gallery/objekat-vladimirci-2-mobile.webp" imagesrcset="./assets/gallery/objekat-vladimirci-2-mobile.webp 750w, ./assets/gallery/objekat-vladimirci-2.webp 1200w" imagesizes="(max-width: 767px) 100vw, 400px" fetchpriority="high">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" fetchpriority="low">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preload" as="script" href="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous">
<link rel="preload" as="script" href="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<title>Galerija | RM-TRGOVINA Vladimirci</title>
<meta name="description" content="Pogledajte fotografije stovarišta i materijala RM-TRGOVINA u Vladimircima.">
<link rel="canonical" href="https://rmtrgovina.rs/galerija">
<meta property="og:type" content="website">
<meta property="og:title" content="Galerija | RM-TRGOVINA Vladimirci">
<meta property="og:description" content="Fotografije stovarišta i materijala RM-TRGOVINA u Vladimircima.">
<meta property="og:url" content="https://rmtrgovina.rs/galerija">
<meta property="og:image" content="https://rmtrgovina.rs/assets/magacin-eksterijer-vladimirci.jpg">
<meta name="twitter:card" content="summary_large_image">
<script src="./support.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"HardwareStore","name":"RM-TRGOVINA","image":"https://rmtrgovina.rs/assets/magacin-eksterijer-vladimirci.jpg","address":{"@type":"PostalAddress","streetAddress":"Beogradski put 1130","addressLocality":"Skupljen","postalCode":"15225","addressCountry":"RS"},"telephone":"+381653360060","url":"https://rmtrgovina.rs/galerija","areaServed":"Vladimirci i okolina"}</script>
<script src="./image-slot.js" defer></script>
<style>
*{box-sizing:border-box;}html,body{margin:0;background:#F4F4F2;overflow-x:hidden;max-width:100%;}
@keyframes tileIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
</style>
</helmet>
<div style="font-family:'Source Sans 3',sans-serif;background:#F4F4F2;min-height:100%;display:flex;flex-direction:column;">
<dc-import name="Header" active-page="Galerija" hint-size="100%,72px"></dc-import>
<main style="flex:1 0 auto;">

<section style="max-width:1280px;margin:0 auto;padding:64px 24px 40px;">
  <div style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.1em;color:#E3000F;text-transform:uppercase;margin-bottom:14px;">Galerija</div>
  <h1 style="font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(30px,4vw,42px);color:#2F2483;margin:0 0 12px;">Magacin i roba, iz blizine.</h1>
  <p style="font-family:'Source Sans 3',sans-serif;font-size:16px;color:#6B7280;max-width:600px;">Objekat, stovarište i roba — fotografije sa naše lokacije u Vladimircima.</p>
</section>

<section style="max-width:1280px;margin:0 auto;padding:0 24px 90px;">
  <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="3">
    <div style="margin-bottom:56px;">
      <div style="border-bottom:2px solid #2F2483;padding-bottom:10px;margin-bottom:22px;">
        <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;">
          <h2 style="font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;color:#2F2483;margin:0;">{{ cat.name }}</h2>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:{{ galGridCols }};gap:20px;">
        <sc-for list="{{ cat.tiles }}" as="t" hint-placeholder-count="4">
          <div ref="{{ t.ref }}" onClick="{{ t.onClick }}" style="{{ t.wrapStyle }}">
            <sc-if value="{{ t.mounted }}" hint-placeholder-val="{{ true }}">
              <image-slot id="{{ t.id }}" fit="cover" shape="rect" radius="0" fetchpriority="{{ t.fetchpriority }}" srcset="{{ t.srcset }}" sizes="{{ t.sizes }}" alt="{{ t.alt }}" src="{{ t.src }}" placeholder="{{ t.label }}"></image-slot>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
  <sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
    <div data-raw-hide style="position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;display:flex;align-items:center;justify-content:center;">
      <div onClick="{{ closeLightbox }}" style="position:absolute;inset:0;cursor:pointer;"></div>
      <div style="position:relative;width:92vw;height:92vh;pointer-events:none;">
        <image-slot id="gal-lightbox" fit="contain" shape="rect" radius="0" alt="{{ lightboxAlt }}" src="{{ lightboxSrc }}" placeholder="Slika"></image-slot>
      </div>
      <button onClick="{{ prevImg }}" aria-label="Prethodna" style="position:absolute;top:50%;left:24px;transform:translateY(-50%);width:48px;height:48px;background:rgba(255,255,255,0.15);color:#FFFFFF;border:none;font-size:22px;cursor:pointer;z-index:2;">&#8249;</button>
      <button onClick="{{ nextImg }}" aria-label="Sledeća" style="position:absolute;top:50%;right:24px;transform:translateY(-50%);width:48px;height:48px;background:rgba(255,255,255,0.15);color:#FFFFFF;border:none;font-size:22px;cursor:pointer;z-index:2;">&#8250;</button>
      <button onClick="{{ closeLightbox }}" aria-label="Zatvori" style="position:absolute;top:24px;right:32px;width:44px;height:44px;background:rgba(255,255,255,0.15);color:#FFFFFF;border:none;font-size:24px;cursor:pointer;z-index:2;">&times;</button>
    </div>
  </sc-if>
</section>

</main>
<dc-import name="Footer" hint-size="100%,300px"></dc-import>
<dc-import name="CookieBanner" hint-size="100%,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isMobile: typeof window !== 'undefined' ? window.innerWidth < 760 : false, visible: {}, lightboxIndex: null };
  componentDidMount() {
    this.onResize = () => { this.setState({ isMobile: window.innerWidth < 760 }); this.checkVisible(); };
    window.addEventListener('resize', this.onResize);
    // Reveals below-the-fold tiles as the page scrolls. This used to run
    // on IntersectionObserver rooted implicitly at the viewport, but on
    // this site that never fired past its initial mount-time batch. Root
    // cause: <body> here is height:100vh with overflow-y:auto (this whole
    // app renders inside a fixed-height, internally-scrolling shell) -
    // window.scrollTo() is a no-op and window.scrollY never changes, real
    // scrolling happens INSIDE body, and Chromium's viewport-rooted
    // IntersectionObserver fast-path doesn't re-evaluate off of that
    // (only off document.scrollingElement's own scroll position, which
    // never moves here). A plain scroll-driven getBoundingClientRect()
    // check (same 600px lookahead the old rootMargin used) sidesteps that
    // by not depending on which element is "the" scroller at all.
    this.onScroll = () => {
      if (this.__scrollTicking) return;
      this.__scrollTicking = true;
      requestAnimationFrame(() => { this.__scrollTicking = false; this.checkVisible(); });
    };
    // capture: true - a 'scroll' event fired by an overflow:auto element
    // (body, here) doesn't bubble per spec, so a bubble-phase listener on
    // window never sees it; capture-phase listeners still do, since
    // capture always walks the full ancestor chain on the way down.
    window.addEventListener('scroll', this.onScroll, { passive: true, capture: true });
    this.checkVisible();
  }
  checkVisible() {
    const nodes = this.tileNodes || [];
    const vh = window.innerHeight || 0;
    let changed = null;
    nodes.forEach((el, i) => {
      if (!el || this.state.visible[i]) return;
      const rect = el.getBoundingClientRect();
      if (rect.top < vh + 600 && rect.bottom > -600) {
        (changed = changed || {})[i] = true;
      }
    });
    if (changed) this.setState(s => ({ visible: { ...s.visible, ...changed } }));
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll, { capture: true });
  }
  renderVals() {
    const isMobile = this.state.isMobile;
    const catDefs = [
      { name: 'Objekat i stovarište', files: ['vozni-park.webp','objekat-vladimirci-2.webp','stovariste-vladimirci-1.webp','stovariste-vladimirci-3.webp','objekat-vladimirci-4.webp','objekat-vladimirci-5.webp'] },
      { name: 'Cement i vezivni materijali', files: ['krec-1.webp','cement-2.webp'] },
      { name: 'Armatura i gvožđe', files: ['armatura-1.webp','armatura-2.webp','armatura-3.webp','armatura-4.webp','uzengije-1.webp','armatura-6.webp'] },
      { name: 'Opeka i blok', files: ['betonski-blok-2.webp','blok-i-cigla-1.webp','blok-i-cigla-3.webp','betonski-blok-i-cigla-5.webp','blok-2.webp','betonski-blok-1.webp'] },
      { name: 'Krovni materijali', files: ['crep-1.webp','crep-2.webp'] },
      { name: 'Agregati', files: ['sljunak-ploce.webp','materijal-u-magacinu.webp'] },
      { name: 'Građa', files: ['gradja-rogovi-1.webp','gradja-2.webp','gradja-3.webp','gradja-4.webp','gradja-5.webp','gradja-6.webp','gradja-7.webp','gradja-8.webp','gradja-9.webp'] },
      { name: 'Ostalo', files: ['djubrivo-uskladisteno.webp','betonske-cevi.webp'] },
    ];
    const files = [];
    catDefs.forEach(c => c.files.forEach((f, j) => files.push([f, c.name, c.name + ' — fotografija ' + (j + 1)])));
    // Mobile-sized (750px) companions for all 6 eagerly-loaded tiles
    // (category 0 - the ones that render immediately with a real src,
    // below). These 6 loading full-resolution (1200px) originals in
    // parallel on a throttled mobile connection is what was pushing LCP
    // past 6s: whichever of them finished loading LAST became the final
    // LCP candidate, since every tile in this grid renders at the same
    // size and each new same-size paint replaces the previous LCP entry.
    const mobileVariants = {
      'vozni-park.webp': 'vozni-park-mobile.webp',
      'objekat-vladimirci-2.webp': 'objekat-vladimirci-2-mobile.webp',
      'stovariste-vladimirci-1.webp': 'stovariste-vladimirci-1-mobile.webp',
      'stovariste-vladimirci-3.webp': 'stovariste-vladimirci-3-mobile.webp',
      'objekat-vladimirci-4.webp': 'objekat-vladimirci-4-mobile.webp',
      'objekat-vladimirci-5.webp': 'objekat-vladimirci-5-mobile.webp',
    };
    this.tileNodes = this.tileNodes || [];
    let idx = 0;
    const categories = catDefs.map(c => {
      const tiles = c.files.map((fname, j) => {
        const i = idx++;
        // Plain fallback filename for the `src` attribute below - the
        // mobile variant when one exists, not the full-resolution original.
        // `src` only matters for real rendering on a srcset-unaware
        // browser (none in practice); every modern browser's real image
        // candidate selection is governed entirely by srcset+sizes below,
        // REGARDLESS of what src points to. But the browser's speculative
        // PRELOAD SCANNER (the pre-parser that discovers resources before
        // any JS runs) does NOT run that same selection logic on this
        // custom element - it naively fetches the literal `src` value in
        // addition to the srcset-resolved one, so a full-res `src` here
        // was silently doubling network traffic on every load (confirmed
        // via CDP request-initiator inspection: both fetches show up as
        // initiator.type "parser"). Pointing `src` at the small file too
        // eliminates that duplicate fetch with zero effect on what
        // actually renders.
        const fallbackFname = mobileVariants[fname] || fname;
        // Whether this tile is actually mounted as a real <image-slot>
        // custom element yet. Below-the-fold tiles used to ALL mount their
        // own <image-slot> (each with its own shadow DOM, ResizeObserver,
        // event listeners) immediately, even with an empty src - across
        // 35 tiles that's real, measured CPU cost (Style & Layout was the
        // single largest chunk of main-thread work on this page), and
        // Lighthouse's mobile simulation multiplies CPU cost 4x, so it was
        // a real contributor to LCP. Only mounting the custom element once
        // a tile is actually eager/visible cuts the up-front element count
        // from 35 to 6.
        const mounted = i < 6 || this.state.visible[i];
        return {
          id: 'gal-' + i,
          mounted,
          src: mounted ? './assets/gallery/' + fallbackFname : '',
          // Only the first 2 (the ones matched by the preload links above)
          // get fetchpriority=high; same fetchpriority-before-src ordering
          // discipline used elsewhere so image-slot.js picks it up before
          // the src-triggered fetch fires.
          fetchpriority: i < 2 ? 'high' : '',
          srcset: mobileVariants[fname] ? './assets/gallery/' + mobileVariants[fname] + ' 750w, ./assets/gallery/' + fname + ' 1200w' : '',
          sizes: mobileVariants[fname] ? '(max-width: 767px) 100vw, 400px' : '',
          alt: c.name + ' — fotografija ' + (j + 1),
          label: c.name,
          // The fade-in animation only matters for tiles visible at load -
          // applying it (and its keyframe/timing bookkeeping) to all 35
          // wrapper divs was extra style-engine work for the 29 that are
          // still empty placeholders at that point anyway; they get a
          // fresh element (and can fade in then, if wanted later) once
          // they actually mount.
          wrapStyle: 'min-width:0;height:300px;background:#EAE8E5;cursor:pointer;'
            + (mounted ? 'animation:tileIn 0.5s ease ' + (Math.min(i, 8) * 0.05).toFixed(2) + 's both;' : ''),
          onClick: () => this.setState({ lightboxIndex: i }),
          ref: (el) => { this.tileNodes[i] = el; },
        };
      });
      return { name: c.name, countLabel: String(c.files.length).padStart(2, '0'), tiles };
    });
    const li = this.state.lightboxIndex;
    return {
      lightboxOpen: li != null,
      lightboxSrc: li != null ? './assets/gallery/' + files[li][0] : '',
      lightboxAlt: li != null ? files[li][2] : '',
      closeLightbox: () => this.setState({ lightboxIndex: null }),
      prevImg: () => this.setState(s => ({ lightboxIndex: (s.lightboxIndex - 1 + files.length) % files.length })),
      nextImg: () => this.setState(s => ({ lightboxIndex: (s.lightboxIndex + 1) % files.length })),
      categories, galGridCols: isMobile ? 'repeat(1,minmax(0,1fr))' : 'repeat(3,minmax(0,1fr))' };
  }
}
</script>
</body>
</html>
